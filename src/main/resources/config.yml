# Multipliers per English level
multipliers:
  a0: 1.0
  a1: 2.0
  a2: 3.0
  b1: 4.0
  b2: 5.0
  c1: 5.0
  c2: 5.0
  d1: 5.0

# Lifetime earnings thresholds for level-up
thresholds:
  a1: 100.0
  a2: 1000.0
  b1: 10000.0
  b2: 50000.0
  c1: 200000.0
  c2: 500000.0
  d1: 1000000.0

# LuckPerms config
luckperms:
  track: "english"
  promote-on-levelup: true

# Notification when leveling up (use & for color codes)
levelup-messages:
  - "&6🎓 &eLevel UP! &a%s &e→ &6%s &e— new multiplier: &c×%.0f"
  - "&d🌟 &fCongratulations! &a%s &f→ &d%s&f! &eEarnings multiplier: &c×%.0f"
  - "&b📈 &fEnglish level increased: &a%s &f→ &b%s &f(&c×%.0f&f earnings!)"
